<!DOCTYPE html>
<html>
    <head>
        <title>Color picker game</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Color Picker Game!</h1>
        <hr>
        <div id="target" class="color">Target</div><br>
        <div id="guess" class="color">Guess</div><br>
        <div class="container">
            <div>R:</div><input type="range" id="r" min="0" max="255" class="slider">
            <div>G:</div><input type="range" id="g" min="0" max="255" class="slider">
            <div>B:</div><input type="range" id="b" min="0" max="255" class="slider">
        </div><br>
        <button id="submit">Results</button>
        <button id="again">Again/Start</button>
        <div id="results"></div>
        <script src="script.js"></script>
    </body>
</html>
