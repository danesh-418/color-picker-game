<!DOCTYPE html>
<html>
    <head>
        <title>Color picker game</title>
        <style>
        .color {
            padding: 1em;
            border-color: black;
        }
        </style>
    </head>
    <body>
        <h1>Color Picker Game!</h1>
        <hr>
        <div id="target" class="color">Target</div><br>
        <div id="guess" class="color">Guess</div><br>
        <input type="range" id="r" min="0" max="255" class="slider"><br>
        <input type="range" id="g" min="0" max="255" class="slider"><br>
        <input type="range" id="b" min="0" max="255" class="slider"><br>
        <button id="submit">Results</button>
        <button id="again">Again/Start</button>
        <div id="results"></div>
        <script src="script.js"/>
    </body>
</html>
